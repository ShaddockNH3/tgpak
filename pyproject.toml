[project]
name = "tgpak"
version = "0.1.0"
description = "Grab Telegram album originals in order, plus PikPak and OpenList helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.45",
    "aiohttp>=3.9",
    "requests>=2.31",
    "pikpakapi>=0.1.11",
]

[project.scripts]
tgpak = "tgpak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgpak"]
